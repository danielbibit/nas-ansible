---
- name: Install alloy
  when: alloy_enabled is true
  block:
    - name: Check push targets are set
      ansible.builtin.assert:
        that:
          - not alloy_metrics_enabled or alloy_prometheus_url | length > 0
          - not alloy_logs_enabled or alloy_loki_url | length > 0
        fail_msg: Set alloy_prometheus_url when alloy_metrics_enabled, and alloy_loki_url when alloy_logs_enabled

    - name: Check if docker is installed
      ansible.builtin.stat:
        path: "{{ alloy_docker_socket }}"
      register: alloy_docker_socket_stat

    - name: Set docker logs fact
      ansible.builtin.set_fact:
        alloy_ship_docker_logs: "{{ alloy_logs_enabled and alloy_docker_logs and alloy_docker_socket_stat.stat.exists }}"

    - name: Make sure keyrings directory exists
      ansible.builtin.file:
        path: "{{ alloy_keyring | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add grafana apt key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg.key
        dest: "{{ alloy_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add grafana apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ alloy_keyring }}] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install alloy
      ansible.builtin.apt:
        name: alloy
        state: present
        update_cache: true

    - name: Allow alloy to read logs
      ansible.builtin.user:
        name: alloy
        groups: "{{ ['adm', 'systemd-journal'] + (['docker'] if alloy_ship_docker_logs else []) }}"
        append: true
      notify: Restart alloy

    - name: Template alloy config
      ansible.builtin.template:
        src: "{{ role_path }}/templates/config.alloy.j2"
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: "0640"
        validate: alloy fmt %s
      notify: Restart alloy

    - name: Enable alloy service
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started

    - name: Remove standalone node_exporter
      when: alloy_metrics_enabled and alloy_builtin_exporter and alloy_remove_node_exporter
      block:
        # Switch Alloy to the built-in exporter before node_exporter goes away
        - name: Apply alloy config
          ansible.builtin.meta: flush_handlers

        - name: Check if node_exporter is installed
          ansible.builtin.stat:
            path: /etc/systemd/system/node_exporter.service
          register: alloy_node_exporter_service

        - name: Stop and disable node_exporter
          ansible.builtin.systemd:
            name: node_exporter
            state: stopped
            enabled: false
          when: alloy_node_exporter_service.stat.exists

        - name: Remove node_exporter files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/node_exporter.service
            - /usr/local/bin/node_exporter
          register: alloy_node_exporter_removed

        - name: Reload systemd # noqa no-handler
          ansible.builtin.systemd:
            daemon_reload: true
          when: alloy_node_exporter_removed is changed

    - name: Check if promtail is installed
      ansible.builtin.stat:
        path: /etc/systemd/system/multi-user.target.wants/promtail.service
      register: alloy_promtail_service
      when: alloy_disable_promtail

    - name: Stop and disable promtail
      ansible.builtin.systemd:
        name: promtail
        state: stopped
        enabled: false
      register: alloy_promtail_stopped
      when: alloy_disable_promtail and alloy_promtail_service.stat.exists

    # Promtail can time out while stopping, which leaves the unit in failed state
    - name: Clear promtail failed state # noqa no-handler
      ansible.builtin.command: systemctl reset-failed promtail
      changed_when: false
      failed_when: false
      when: alloy_promtail_stopped is changed

- name: Remove alloy
  when: alloy_enabled is false
  block:
    - name: Uninstall alloy
      ansible.builtin.apt:
        name: alloy
        state: absent
        purge: true

    - name: Remove grafana apt repository and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/grafana.list
        - "{{ alloy_keyring }}"
