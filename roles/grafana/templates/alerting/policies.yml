---
apiVersion: 1
policies:
  - orgId: 1
    receiver: email
    group_by: ['grafana_folder', 'alertname', 'instance']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: '{{ grafana_alert_repeat_interval }}'
    routes:
      - receiver: email
        object_matchers:
          - ['severity', '=', 'critical']
        repeat_interval: '{{ grafana_alert_critical_repeat_interval }}'
