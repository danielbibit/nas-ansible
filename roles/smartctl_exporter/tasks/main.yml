---
- name: Start stack
  when: smartctl_exporter_enabled is true
  block:
    - name: Make sure compose directory exists
      ansible.builtin.file:
        path: '{{ nas_docker_compose_dir }}/smartctl_exporter'
        state: directory
        owner: '{{ nas_docker_uid }}'
        group: '{{ nas_docker_gid }}'
        mode: "0775"

    - name: Copy compose
      ansible.builtin.template:
        src: '{{ role_path }}/templates/docker-compose.yml'
        dest: '{{ nas_docker_compose_dir }}/smartctl_exporter/docker-compose.yml'
        owner: '{{ nas_docker_uid }}'
        group: '{{ nas_docker_gid }}'
        mode: "0775"

    - name: Start stack
      community.docker.docker_compose_v2:
        project_src: '{{ nas_docker_compose_dir }}/smartctl_exporter'
        state: present
        pull: missing
        remove_orphans: true

- name: Stop stack
  when: smartctl_exporter_enabled is false
  block:
    - name: Check if compose directory exists
      ansible.builtin.stat:
        path: '{{ nas_docker_compose_dir }}/smartctl_exporter'
      register: _smartctl_exporter_dir

    - name: Tear down existing stack
      community.docker.docker_compose_v2:
        project_src: '{{ nas_docker_compose_dir }}/smartctl_exporter'
        state: absent
      when: _smartctl_exporter_dir.stat.exists and _smartctl_exporter_dir.stat.isdir

    - name: Remove compose files
      ansible.builtin.file:
        path: '{{ nas_docker_compose_dir }}/smartctl_exporter'
        state: absent
