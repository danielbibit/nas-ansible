---
- name: Install and connect tailscale
  when: tailscale_native_enabled is true
  block:
    - name: Add tailscale apt key
      ansible.builtin.get_url:
        url: "{{ tailscale_native_repo_url }}/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
        dest: "{{ tailscale_native_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add tailscale apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by={{ tailscale_native_keyring }}]
          {{ tailscale_native_repo_url }} {{ ansible_facts['distribution_release'] }} main
        filename: tailscale
        state: present

    - name: Install tailscale
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable IP forwarding for advertised routes
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: "1"
        sysctl_file: /etc/sysctl.d/99-tailscale.conf
        reload: true
      loop:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding
      when: tailscale_native_advertise_routes | length > 0

    - name: Enable tailscaled service
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Get tailscale status
      ansible.builtin.command: tailscale status --json
      register: tailscale_native_status
      changed_when: false
      failed_when: false

    - name: Log in to tailscale
      ansible.builtin.command: >-
        tailscale up
        --auth-key={{ tailscale_native_authkey }}
        {{ '--hostname=' ~ tailscale_native_hostname if tailscale_native_hostname else '' }}
        --advertise-routes={{ tailscale_native_advertise_routes | join(',') }}
        --accept-routes={{ tailscale_native_accept_routes | lower }}
      no_log: true
      changed_when: true
      when: >-
        tailscale_native_status.rc != 0 or
        (tailscale_native_status.stdout | from_json).BackendState != 'Running'

    - name: Get tailscale preferences
      ansible.builtin.command: tailscale debug prefs
      register: tailscale_native_prefs_raw
      changed_when: false

    - name: Apply tailscale settings
      vars:
        tailscale_native_prefs: "{{ tailscale_native_prefs_raw.stdout | from_json }}"
      ansible.builtin.command: >-
        tailscale set
        {{ '--hostname=' ~ tailscale_native_hostname if tailscale_native_hostname else '' }}
        --advertise-routes={{ tailscale_native_advertise_routes | join(',') }}
        --accept-routes={{ tailscale_native_accept_routes | lower }}
      changed_when: true
      when: >-
        (tailscale_native_prefs.AdvertiseRoutes or []) | sort != tailscale_native_advertise_routes | sort or
        tailscale_native_prefs.RouteAll != tailscale_native_accept_routes or
        (tailscale_native_hostname and tailscale_native_prefs.Hostname != tailscale_native_hostname)

- name: Remove tailscale
  when: tailscale_native_enabled is false
  block:
    - name: Log out of tailscale # noqa no-changed-when
      ansible.builtin.command: tailscale logout
      failed_when: false

    - name: Uninstall tailscale
      ansible.builtin.apt:
        name: tailscale
        state: absent
        purge: true

    - name: Remove tailscale apt repository and key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/tailscale.list
        - "{{ tailscale_native_keyring }}"
